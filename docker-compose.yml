services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Kolkata
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - resume_uploads:/app/uploads

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Kolkata
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  django_admin:
    build:
      context: ./admin_panel
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Kolkata
    ports:
      - "8001:8001"
    env_file:
      - .env
    command: sh -c "python manage.py migrate --run-syncdb && python manage.py shell -c \"from django.contrib.auth import get_user_model; U = get_user_model(); U.objects.filter(username='admin').exists() or U.objects.create_superuser('admin', 'admin@intellihire.com', 'admin123')\" && python manage.py runserver 0.0.0.0:8001"

volumes:
  resume_uploads: